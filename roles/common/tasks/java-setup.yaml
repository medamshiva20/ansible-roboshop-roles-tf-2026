- name: Install maven 
  ansible.builtin.dnf:
   name: maven 
   state: present

- name: Create system user
  ansible.builtin.user:
   name: roboshop
   system: true
   home: /app
   shell: /sbin/nologin
   comment: roboshop system user

- name: Delete app folder
  ansible.builtin.file:
   name: /app
   state: absent

- name: Create app folder
  ansible.builtin.file:
   name: /app
   state: directory

- name: Delete the existing {{component}} zip code
  ansible.builtin.file:
   path: /tmp/{{component}}.zip
   state: absent

- name: Download {{component}} zip code
  ansible.builtin.get_url:
   url: https://roboshop-artifacts.s3.amazonaws.com/{{component}}-{{app_version}}.zip
   dest: /tmp/{{component}}.zip

- name: Unarchive zip code
  ansible.builtin.unarchive:
   src: /tmp/{{component}}.zip
   dest: /app
   remote_src: yes


- name: Install dependencie
  ansible.builtin.command: mvn clean package
  args:
   chdir: /app

- name: Rename the jar file
  ansible.builtin.shell: mv target/shipping-1.0.jar shipping.jar
  args:
   chdir: /app 
